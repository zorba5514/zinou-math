<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>الأستاذ زين الدين للرياضيات</title>
  <style>
    :root {
      --bg: #111111;
      --surface: #1c1c1c;
      --gold: #f2c200;
      --text: #f5f5f5;
      --muted: #b8b8b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
      line-height: 1.7;
    }
    main {
      width: 100%;
      max-width: 560px;
      padding: 32px 24px;
      border: 1px solid #2c2c2c;
      border-radius: 16px;
      background: var(--surface);
      text-align: center;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      background: var(--gold);
      color: var(--bg);
      font-size: 40px;
      font-weight: 800;
      clip-path: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .slogan { margin: 0 0 24px; color: var(--gold); font-size: 1.15rem; font-weight: 600; }
    .status { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">Z</div>
    <h1>الأستاذ زين الدين للرياضيات</h1>
    <p class="slogan">الرياضيات كما يجب أن تكون</p>
    <p class="status">المنصة قيد الإنشاء. هذه نسخة الاختبار.</p>
  </main>
</body>
</html>
